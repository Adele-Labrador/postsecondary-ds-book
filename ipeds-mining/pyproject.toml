[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipeds-utils"
version = "1.1.0"
description = "Shared utilities for the Mining IPEDS Data guidebook"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0", "numpy>=1.24", "scipy>=1.11", "pyarrow>=14", "openpyxl>=3.1", "requests>=2.31",
]

[project.optional-dependencies]
# Analysis notebooks 01-10. Tested with scikit-learn 1.9.1, statsmodels 0.15.0,
# scipy 1.18.1, matplotlib 3.11.2, pandas 3.0.5, numpy 2.5.3 on Python 3.14.
analysis = ["scikit-learn>=1.3", "statsmodels>=0.14", "matplotlib>=3.7", "jupyterlab>=4.0", "nbclient>=0.9"]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

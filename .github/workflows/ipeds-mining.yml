name: ipeds-mining

on:
  push:
    branches: [main]
    paths: ["ipeds-mining/**", ".github/workflows/ipeds-mining.yml"]
  pull_request:
    branches: [main]
    paths: ["ipeds-mining/**", ".github/workflows/ipeds-mining.yml"]

jobs:
  test:
    name: ipeds-mining tests (Python ${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        resolution: [highest]
        include:
          # Oldest declared dependency floors, on the oldest supported Python.
          - python-version: "3.10"
            resolution: lowest-direct
    defaults:
      run:
        working-directory: ipeds-mining

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install ipeds-utils with analysis and dev extras
        run: uv pip install --system --resolution ${{ matrix.resolution }} -e ".[analysis,dev]"

      - name: Show resolved versions
        run: python -c "import sys, pandas, numpy, scipy, sklearn, statsmodels, matplotlib; print(sys.version); print('pandas', pandas.__version__, 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'sklearn', sklearn.__version__, 'statsmodels', statsmodels.__version__, 'matplotlib', matplotlib.__version__)"

      - name: Run offline tests
        run: pytest tests -m "not network" -q

      - name: Check the analysis notebook builder
        run: python tools/build_analysis_notebooks.py --check
